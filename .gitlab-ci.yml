# Static site on GitLab Pages: just copies the files, no build tooling.
pages:
  stage: deploy
  image: busybox:latest
  script:
    - mkdir public
    - cp index.html style.css public/
    - cp -r grade-* public/
  pages: true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
